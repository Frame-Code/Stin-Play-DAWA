<div>
    <h2>Agregar nuevo curso</h2>
    <div>
        <label for="course-name">Nombre del curso: </label>
        <input type="text" name="course-name" id="course-name" placeholder="Course Name" >
    </div>
    <div>
        <label for="course-instructor">Instructor: </label>
        <input type="text" name="course-instructor" id="course-instructor" placeholder="Instructor Name">
    </div>
    <div>
        <label for="course-status">Activar curso: </label>
        <input type="checkbox" name="course-status" id="course-status">
    </div>
</div>
